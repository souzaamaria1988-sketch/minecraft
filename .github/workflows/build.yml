name: Build Mod 1.16.5

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Install Gradle 8.6
      run: |
        wget https://services.gradle.org/distributions/gradle-8.6-bin.zip
        unzip -d $HOME gradle-8.6-bin.zip
        
    - name: Build with Gradle
      run: $HOME/gradle-8.6/bin/gradle build --no-daemon
      
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sneaky-enchant-mod-1.16.5
        path: build/libs/*.jar